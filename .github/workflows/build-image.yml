
name: Build Topaz VAI image

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/topaz-vai" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VAI_VERSION=4.2.2.1.b
            VAI_SHA2=564415a97b31723f421d99e85e97902a6f5521e8fe8acc726355b73f0f47f859
          tags: |
            ${{ steps.image.outputs.name }}:4.2.2.1b
